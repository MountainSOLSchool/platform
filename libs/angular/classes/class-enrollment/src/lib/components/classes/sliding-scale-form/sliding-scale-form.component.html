@let paymentRangeValue = paymentRange();
@let userCostValue = userCost();

<div class="sliding-scale-label">Sliding Scale Cost</div>

<mat-form-field appearance="outline" class="amount-field">
    <mat-label>Amount (USD)</mat-label>
    <span matTextPrefix>$&nbsp;</span>
    <input
        matInput
        type="number"
        [min]="paymentRangeValue.lowest"
        [max]="paymentRangeValue.highest"
        [ngModel]="userCostValue"
        (ngModelChange)="customCostSelected($event)"
    />
</mat-form-field>

<div class="slider-row">
    <button
        mat-icon-button
        type="button"
        aria-label="Decrease amount"
        [disabled]="userCostValue <= paymentRangeValue.lowest"
        (click)="customCostSelected(userCostValue - 5)"
    >
        <mat-icon>remove</mat-icon>
    </button>
    <mat-slider
        class="amount-slider"
        [step]="5"
        [min]="paymentRangeValue.lowest"
        [max]="paymentRangeValue.highest"
    >
        <input
            matSliderThumb
            [ngModel]="userCostValue"
            (ngModelChange)="customCostSelected($event)"
        />
    </mat-slider>
    <button
        mat-icon-button
        type="button"
        aria-label="Increase amount"
        [disabled]="userCostValue >= paymentRangeValue.highest"
        (click)="customCostSelected(userCostValue + 5)"
    >
        <mat-icon>add</mat-icon>
    </button>
</div>
